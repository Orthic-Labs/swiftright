[package]
name = "swiftright-render"
version = "0.0.3"
edition = "2021"
publish = false

# SwiftRight renderer, ABI v0 (render/swiftright-abi/include/swiftright.h).
# cdylib exposing GPUI 0.2.2 + AccessKit to a Swift host through a versioned C ABI.
# Windows only (the whole crate is cfg(windows)). Exact pins are the SR0-D tuple; the
# Cargo.lock started from probes/sr0-b/text-geometry/Cargo.lock.
[lib]
name = "swiftright_render"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
gpui = "=0.2.2"
accesskit = "=0.25.1"
accesskit_windows = "=0.35.1"
# Same version gpui 0.2.2 resolves to (Cargo.lock); needed to build the RenderImage frame
# for SWR_PRIM_IMAGE (gpui does not re-export `image`). Default features stay off here;
# gpui enables what it needs.
image = { version = "=0.25.10", default-features = false }
raw-window-handle = "=0.6.2"
# Same version gpui 0.2.2 resolves to (Cargo.lock). Named only for LineCap / LineJoin, which gpui's StrokeOptions takes but does not
# re-export (SWR_PRIM_PATH strokes, ABI 0.12).
lyon_tessellation = "=1.0.22"
# Same version gpui 0.2.2 resolves to (Cargo.lock). DirectWrite is already enabled by gpui; named here because the face resolver
# (src/dwr.rs, ABI 0.8) calls it directly. Same pin and features as probes/f0-text-facts, which compiles in CI.
windows = { version = "=0.61.3", features = ["Win32_Graphics_DirectWrite", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_TextServices", "Win32_UI_Input_Ime"] }
# The `implement` macro (src/tsf.rs, TSF text store, opt-in SWIFTRIGHT_IME_TSF=1) expands to `windows_core::` paths; same version windows 0.61.3 resolves to (Cargo.lock).
windows-core = "=0.61.2"
# RightKit's rotating plain-text writer (SWR_FRAME_LOG trace file). Exact pin; default features
# off so the `http` (ureq) upload stack stays out of the renderer. No tracing or global subscriber:
# the writer is constructed at the point of use, so nothing is initialised for the host.
rightkit-logs = { version = "=0.3.0", default-features = false }

# Same version already in Cargo.lock (fontdb). Glyph outlines of the face a run was drawn with, variation axes applied (src/outline.rs,
# ABI 0.14). Default features (std, variable-fonts, ...) are the ones fontdb already unifies.
ttf-parser = "=0.25.1"

[workspace]
