# Build-only lane for the Windows Graphics Capture recorder (factory/native/windows/wgc-record), uploaded as an artifact so a
# Windows host can record live frames without compiling locally (public repo: compile only in GitHub Actions). Same compile line as
# the screen_record=wgc step of factory-pairs.yml. Read-only permissions; no secrets, no signing, no publication.
name: wgc-record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: factory/native/windows/wgc-record
          sparse-checkout-cone-mode: true
      - name: Compile FactoryWGCRecord.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the C++ x64 tools found by vswhere' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $outDir = Join-Path $env:RUNNER_TEMP 'wgc-record'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE 'factory\native\windows\wgc-record\wgc-record.cpp'
          $exe = Join-Path $outDir 'FactoryWGCRecord.exe'
          $bat = Join-Path $outDir 'build.bat'
          $line = "cl /nologo /std:c++20 /EHsc /O2 /W3 /DUNICODE /D_UNICODE `"$src`" /Fo`"$outDir\wgc-record.obj`" /Fe`"$exe`" /link /SUBSYSTEM:CONSOLE windowsapp.lib d3d11.lib dxgi.lib windowscodecs.lib ole32.lib user32.lib"
          Set-Content -LiteralPath $bat -Value @('@echo off', "call `"$vcvars`" >nul", $line, 'exit /b %ERRORLEVEL%') -Encoding ASCII
          & cmd.exe /c $bat
          if ($LASTEXITCODE -ne 0) { throw "cl exit code $LASTEXITCODE" }
          Remove-Item -LiteralPath "$outDir\wgc-record.obj", $bat
          "$((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower())  FactoryWGCRecord.exe`ncommit=$env:GITHUB_SHA" | Set-Content (Join-Path $outDir 'build-info.txt')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wgc-record-${{ github.sha }}
          path: ${{ runner.temp }}/wgc-record
          retention-days: 30
          if-no-files-found: error
