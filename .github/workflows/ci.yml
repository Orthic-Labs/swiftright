# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/ci.yml | Template version: 1.8.0
name: swiftright-ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && github.run_id || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  supersede:
    needs: [private-repo-guard]
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel superseded runs that only just started or are failing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RIGHT_GIT_GRACE_FRACTION: "0.7"
          RIGHT_GIT_MEDIAN_WINDOW: "10"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/supersede.mjs" <<'RIGHT_GIT_SUPERSEDE_EOF'
          // One CI run in progress per repository, without cancelling work that is nearly done.
          //
          // Rendered into the managed ci workflow's `supersede` job (see manifest.mjs
          // supersedeJob) and run there with Node. The file is self-contained: no imports
          // beyond the Node standard library, no placeholder-shaped text, and no
          // GitHub expression syntax, because the renderer embeds it verbatim.
          //
          // A newer push to the default branch cancels an older run of the same workflow
          // when that run has only just started, has not started at all, or already has a
          // failed job. A run that is past the grace fraction of the median successful
          // duration is left to finish; the new run's `ci` job waits for it through a
          // job-level concurrency group with cancel-in-progress false.

          import { pathToFileURL } from "node:url";

          export const DEFAULT_GRACE_FRACTION = 0.7;
          export const DEFAULT_MEDIAN_WINDOW = 10;
          // Fewer successful runs than this gives no trustworthy median, so nothing is
          // cancelled for being young; only unstarted runs and failing runs are.
          export const MIN_HISTORY = 3;

          const FAILED_JOB_CONCLUSIONS = new Set(["failure", "timed_out"]);

          export function median(values) {
            const sorted = values.filter((value) => Number.isFinite(value) && value >= 0).sort((a, b) => a - b);
            if (sorted.length === 0) return null;
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 === 1 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
          }

          /** Duration in milliseconds of a finished run, or null when the timestamps are unusable. */
          export function runDurationMs(run) {
            const start = Date.parse(run?.run_started_at ?? run?.created_at ?? "");
            const end = Date.parse(run?.updated_at ?? "");
            if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) return null;
            return end - start;
          }

          /**
           * Pure decision for one older run.
           *   run: { status, run_started_at | created_at }
           *   jobs: [{ conclusion }]
           *   medianMs: median duration of recent successful runs, or null when unknown
           * Returns { cancel: boolean, reason: string }.
           */
          export function decideSupersede({ run, jobs = [], medianMs = null, nowMs, graceFraction = DEFAULT_GRACE_FRACTION }) {
            if (run.status !== "in_progress") return { cancel: true, reason: "not started (" + run.status + ")" };
            if (jobs.some((job) => FAILED_JOB_CONCLUSIONS.has(job.conclusion))) return { cancel: true, reason: "a job already failed" };
            if (medianMs === null || !(medianMs > 0)) return { cancel: false, reason: "no median duration to compare with" };
            const startedMs = Date.parse(run.run_started_at ?? run.created_at ?? "");
            if (!Number.isFinite(startedMs)) return { cancel: false, reason: "start time unknown" };
            const elapsedMs = Math.max(0, nowMs - startedMs);
            const limitMs = graceFraction * medianMs;
            if (elapsedMs < limitMs) {
              return { cancel: true, reason: "elapsed " + Math.round(elapsedMs / 1000) + "s is under " + Math.round(limitMs / 1000) + "s" };
            }
            return { cancel: false, reason: "elapsed " + Math.round(elapsedMs / 1000) + "s is past " + Math.round(limitMs / 1000) + "s; left to finish" };
          }

          /** Older runs of the same workflow: lower run number, never the current run. */
          export function olderRuns(runs, current) {
            return runs
              .filter((run) => run.id !== current.id && run.run_number < current.run_number)
              .sort((a, b) => a.run_number - b.run_number);
          }

          export function parseSettings(env) {
            const fraction = env.RIGHT_GIT_GRACE_FRACTION === undefined || env.RIGHT_GIT_GRACE_FRACTION === ""
              ? DEFAULT_GRACE_FRACTION
              : Number(env.RIGHT_GIT_GRACE_FRACTION);
            const window = env.RIGHT_GIT_MEDIAN_WINDOW === undefined || env.RIGHT_GIT_MEDIAN_WINDOW === ""
              ? DEFAULT_MEDIAN_WINDOW
              : Number(env.RIGHT_GIT_MEDIAN_WINDOW);
            if (!(fraction > 0 && fraction <= 1)) throw new Error("RIGHT_GIT_GRACE_FRACTION must be above 0 and at most 1");
            if (!Number.isInteger(window) || window < 1 || window > 100) throw new Error("RIGHT_GIT_MEDIAN_WINDOW must be an integer from 1 to 100");
            return { graceFraction: fraction, medianWindow: window };
          }

          async function api(env, method, path) {
            const response = await fetch((env.GITHUB_API_URL ?? "https://api.github.com") + path, {
              method,
              headers: {
                accept: "application/vnd.github+json",
                authorization: "Bearer " + env.GH_TOKEN,
                "x-github-api-version": "2022-11-28",
              },
            });
            if (response.status === 409) return { conflict: true };
            if (!response.ok) throw new Error(method + " " + path + " failed: " + response.status);
            return response.status === 202 || response.status === 204 ? {} : response.json();
          }

          export async function main(env = process.env, now = () => Date.now()) {
            const settings = parseSettings(env);
            const repo = env.GITHUB_REPOSITORY;
            const branch = env.GITHUB_REF_NAME;
            const current = await api(env, "GET", "/repos/" + repo + "/actions/runs/" + env.GITHUB_RUN_ID);
            const base = "/repos/" + repo + "/actions/workflows/" + current.workflow_id + "/runs?branch=" + encodeURIComponent(branch) + "&event=push&per_page=100";
            const inProgress = (await api(env, "GET", base + "&status=in_progress")).workflow_runs ?? [];
            const queued = (await api(env, "GET", base + "&status=queued")).workflow_runs ?? [];
            const older = olderRuns([...inProgress, ...queued], current);
            if (older.length === 0) {
              console.log("No older run of this workflow is in progress.");
              return [];
            }
            const finished = (await api(env, "GET", base.replace("per_page=100", "per_page=" + settings.medianWindow) + "&status=success")).workflow_runs ?? [];
            const durations = finished.map(runDurationMs).filter((value) => value !== null);
            const medianMs = durations.length >= MIN_HISTORY ? median(durations) : null;
            const decisions = [];
            for (const run of older) {
              const jobs = run.status === "in_progress"
                ? (await api(env, "GET", "/repos/" + repo + "/actions/runs/" + run.id + "/jobs?filter=latest&per_page=100")).jobs ?? []
                : [];
              const decision = decideSupersede({ run, jobs, medianMs, nowMs: now(), graceFraction: settings.graceFraction });
              decisions.push({ id: run.id, ...decision });
              console.log("Run " + run.id + " (#" + run.run_number + "): " + (decision.cancel ? "cancel" : "keep") + ", " + decision.reason);
              if (decision.cancel) await api(env, "POST", "/repos/" + repo + "/actions/runs/" + run.id + "/cancel");
            }
            return decisions;
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
            main().catch((error) => {
              // Cancelling is an optimization: a failure here must not fail the gate.
              console.log("::warning::supersede check skipped: " + error.message);
            });
          }
          RIGHT_GIT_SUPERSEDE_EOF
          node "$RUNNER_TEMP/supersede.mjs"
  ci:
    needs: [private-repo-guard]
    strategy:
      fail-fast: false
      matrix:
        # Full validation stays on one declared runner; prefer configured
        # Windows when available, otherwise preserve first configured OS.
        os: ["windows-2025"]
        node: ["26.8.1"]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && format('{0}-main-{1}-{2}', github.workflow, matrix.os, matrix.node) || format('{0}-{1}-{2}-{3}-{4}', github.workflow, github.run_id, github.run_attempt, matrix.os, matrix.node) }}
      cancel-in-progress: false
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            examples/SliceApp
            packages
            render
            scripts
            probes/sr0-s/fresh-runtime
            probes/sr0-s/fresh-on-bridge/out/tuple12-renderer-recovery-v1/recovered-artifacts-r3
          sparse-checkout-cone-mode: true
          fetch-depth: 0
      - name: Restore last green commit marker
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.right-git-last-green
          key: swiftright-last-green-${{ matrix.os }}-${{ matrix.node }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            swiftright-last-green-${{ matrix.os }}-${{ matrix.node }}-${{ github.ref_name }}-
      - name: Detect Rust-affecting changes
        id: rust-changes
        shell: bash
        env:
          RIGHT_GIT_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          changed=true
          base="$RIGHT_GIT_DIFF_BASE"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            # A push is compared with the last commit this job passed on, never with the previous
            # push: a failed run followed by a non-Rust commit must still run the Rust checks.
            # No marker, or a marker that is not an ancestor, means changed=true.
            base=""
            if [[ -f "$HOME/.right-git-last-green/sha" ]]; then
              base="$(tr -d '[:space:]' < "$HOME/.right-git-last-green/sha")"
            fi
            if [[ "$base" =~ ^[0-9a-fA-F]{40}$ ]] && ! git merge-base --is-ancestor "$base" "$GITHUB_SHA" 2>/dev/null; then
              base=""
            fi
          fi
          if [[ "$base" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "$base" =~ ^0{40}$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if changed_paths="$(git diff --name-only --diff-filter=ACDMRTUXB "$base" "$GITHUB_SHA")"; then
              changed=false
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  *.rs|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|rust-toolchain|*/rust-toolchain|rust-toolchain.toml|*/rust-toolchain.toml|.cargo/*|*/.cargo/*|.rightgit.json|.github/workflows/*.yml|.github/workflows/*.yaml|scripts/gate.sh)
                    changed=true
                    break
                    ;;
                esac
              done <<< "$changed_paths"
            fi
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          required="$changed"
          if [[ "false" == "true" ]]; then
            required=true
          fi
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Print pnpm-lock.yaml patch when the lockfile is stale
        if: failure()
        shell: bash
        run: |
          if pnpm install --lockfile-only; then
            if git diff --quiet -- pnpm-lock.yaml; then
              echo "::notice::pnpm-lock.yaml already matches package.json; the frozen install failed for another reason."
            else
              echo "::group::pnpm-lock.yaml patch (apply and commit)"
              git diff -- pnpm-lock.yaml
              echo "::endgroup::"
              echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml is stale; commit the patch above."
            fi
          else
            echo "::error::pnpm install --lockfile-only failed; no lockfile patch was produced."
          fi

      - name: RightKit ownership (protected registry roots)
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}" && pnpm exec right-release ownership --app . --advisory-when-pending
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: steps.rust-changes.outputs.required == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.rust-changes.outputs.required == 'true'
        with:
          workspaces: |
            render/swiftright-render -> target
          shared-key: swiftright-rust
          add-job-id-key: false
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.rust-changes.outputs.required == 'true'
        with:
          version: "v0.16.0"
      - run: bash ./scripts/gate.sh
        env:
          RIGHT_GIT_RUST_CHANGED: ${{ steps.rust-changes.outputs.changed }}
          RIGHT_GIT_RUST_REQUIRED: ${{ steps.rust-changes.outputs.required }}
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: ${{ steps.rust-changes.outputs.required == 'true' && 'sccache' || '' }}
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
      - name: Record last green commit marker
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.right-git-last-green"
          printf '%s\n' "$GITHUB_SHA" > "$HOME/.right-git-last-green/sha"
      - name: Save last green commit marker
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.right-git-last-green
          key: swiftright-last-green-${{ matrix.os }}-${{ matrix.node }}-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
