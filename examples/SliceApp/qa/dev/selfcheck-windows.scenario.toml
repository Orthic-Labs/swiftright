# Not part of the release plan (lives outside the scenarios/ dirs): checks the runner -> powershell -> driver -> JSON path
# on this host WITHOUT building or launching anything (no window, no process besides powershell itself).
#   rightkit-qa run --config rightkit-qa.toml qa/dev/selfcheck-windows.scenario.toml
name = "dev.selfcheck"
tier = "fast"
target = "engine"
timeout_s = 120

[[step]]
kind = "cli"
label = "driver self-check"
args = ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', 'qa\drive-windows.ps1', 'selfcheck']
timeout_s = 90
  [[step.expect]]
  path = "json.ok"
  eq = true
  [[step.expect]]
  path = "json.uiaLoaded"
  eq = true
